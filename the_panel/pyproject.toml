[project]
name = "the-panel"
version = "0.1.0"
description = "THE PANEL - a multi-lens AI Director pipeline: script -> understanding -> deliberation -> department directives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13",
    "sqlmodel>=0.0.16",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
panel = "the_panel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["the_panel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
