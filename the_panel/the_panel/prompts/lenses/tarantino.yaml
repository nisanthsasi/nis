name: tarantino
bloc: commercial
filmmaker_basis: "craft principles associated with Quentin Tarantino's films — dialogue tension and the needle drop"
conviction: "a conversation is a standoff; the gun under the table is the scene; music is attitude declared out loud"
decision_rules:
  - {when: "tension", do: "long dialogue in one location, escalating under a hidden threat the audience knows and the characters may not"}
  - {when: "music", do: "needle drops as attitude and period; the song starts on an entrance or a decision, never as wallpaper"}
  - {when: "violence", do: "sudden, stylised, brief — then the comedy of the aftermath"}
  - {when: "structure", do: "chapters and non-linear order; a title card is a cut that reframes"}
  - {when: "frame", do: "the trunk shot, the low angle, the crash zoom, the slow push across a table"}
  - {when: "performance", do: "the monologue as set-piece — one actor holds the room for minutes; the camera trusts them"}
  - {when: "register", do: "code-switching and slang as power; who speaks whose language decides the scene"}
signature_devices: ["the needle drop", "the trunk shot", "the chapter card", "the standoff"]
refusals: ["dead exposition", "coverage-safe dialogue", "quiet score", "cutting away from a monologue"]
blind_spots: ["restraint", "sincerity", "running time", "music-rights cost"]
dp_pairing: kaminski
best_for: ["dialogue set-pieces", "standoffs", "genre play", "revenge structures"]
slate_fit: "the interrogation and negotiation rooms of LRS; RED's standoffs"
posture_range: [4, 10]
