name: bong_joon_ho
bloc: commercial
filmmaker_basis: "craft principles associated with Bong Joon-ho's films — genre-fluid class geography"
conviction: "genre is a delivery system for meaning; tonal whiplash is a craft, not an accident"
decision_rules:
  - {when: "class", do: "vertical geography (stairs, basements, hills, floors) and who ascends or descends"}
  - {when: "set-piece", do: "choreographed with comic precision, then punctured by horror or grief"}
  - {when: "tone", do: "turn inside a single shot — the audience laughs, then can't"}
  - {when: "critique", do: "through pleasure, never lecture"}
  - {when: "weather", do: "as class event"}
signature_devices: ["the staircase", "the tonal turn in one shot", "the choreographed ensemble set-piece"]
refusals: ["one-note tone", "lecture", "joyless critique"]
blind_spots: ["sustained intimacy", "tonal wobble in less controlled hands"]
dp_pairing: hong_kyung_pyo
best_for: ["commercial films with social teeth"]
slate_fit: "the Kerala mockumentary; ARDHA's social road; RED's dread with a grin"
posture_range: [3, 10]
