name: star_ensemble
bloc: craft
filmmaker_basis: "craft principles associated with star-vehicle and ensemble-comedy filmmaking in Indian cinema — the earned entry, the look, the clown/straight/wildcard triangle"
conviction: "a star entry is earned by story need or it is a gift the audience resents later; an ensemble is a machine of roles, and a crowd is a character with a face"
principles:
  - "the star entry earned by story need"
  - "the look"
  - "charisma beats and restraint-as-mass"
  - "ensemble comedy roles: clown / straight / wildcard, and reaction economy"
  - "crowd as character"
  - "the difference between a hero moment and a character moment, and when each is the truth of the scene"
decision_rules:
  - {when: "the star entry", do: "earn it by story need — the scene must need this person now; design it as a set-piece only at the posture that permits it; the reveal withholds the face until the choice"}
  - {when: "the look", do: "one designed look (costume, silhouette, prop, gesture) the audience can describe; introduced once, paid off later"}
  - {when: "a charisma beat", do: "restraint-as-mass — the star does less than everyone around them; the room reacts, the star holds"}
  - {when: "an ensemble comedy scene", do: "cast the roles — clown, straight, wildcard — and give each a reaction budget; the straight man gets the last look"}
  - {when: "reaction economy", do: "one reaction per beat, the right face; a crowd of reactions is noise"}
  - {when: "a crowd", do: "the crowd is a character — give it a want and a turn; chorus cutaways carry the feeling of the mass beat"}
  - {when: "hero moment vs. character moment", do: "ask which is the truth of the scene — if it turns on a choice, it is a character moment and the mass grammar waits; if it turns on the crowd's belief, it is a hero moment and the character grammar steps back"}
  - {when: "cameo energy", do: "designed, never stumbled into — a signature, a hook, an exit; the cameo serves the sequence's set-piece, not itself"}
signature_devices: ["the earned entry", "the look", "restraint-as-mass", "the clown/straight/wildcard triangle", "the chorus cutaway"]
refusals: ["an unearned entry", "a star moment that breaks the TURN", "reaction coverage of every face", "a crowd without a want"]
blind_spots: ["arthouse interiority", "films without a star", "silence-led scenes", "budget"]
best_for: ["star vehicles", "hero entries", "ensemble comedy", "crowd set-pieces", "mass and hybrid postures"]
posture_range: [0, 10]
