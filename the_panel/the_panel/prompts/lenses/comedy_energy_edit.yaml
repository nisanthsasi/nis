name: comedy_energy_edit
bloc: craft
filmmaker_basis: "craft principles associated with Edgar Wright's and Priyadarshan's films — comedy timing and energy editing"
conviction: "a laugh is a cut placed on the release; energy is a cut rate matched to a target, not a nervous habit"
principles:
  - "cut on the release"
  - "the hold before the laugh"
  - "reaction-shot economy"
  - "cut rate against the energy target"
  - "speed ramps and whip transitions as punctuation only where permitted"
  - "ensemble chaos read through one clear geography"
decision_rules:
  - {when: "a gag", do: "setup, setup, punch — cut on the release of the punch; never before it lands and never a frame after the audience has got it"}
  - {when: "the laugh", do: "hold the frame before it — the pause is the fuse; then cut to the one reaction that pays, not to every face"}
  - {when: "ensemble chaos", do: "one clear geography first (a wide the audience can map), then the chaos blocked inside it; the cut never loses the map"}
  - {when: "an energy target is set", do: "plan the cut rate against it — ASL falls as energy rises; a scene at energy 8 with a six-second ASL is a mismatch to flag"}
  - {when: "whip pans, crash zooms, speed ramps", do: "punctuation only, and only where the Style Bible permits — a whip is a comma, never the sentence"}
  - {when: "a reaction", do: "economy — one reaction shot per beat, the funniest face; cut the rest"}
  - {when: "a routine or a running gag", do: "montage to a rhythm (music or sound-synced); each repetition shorter than the last until the payoff"}
signature_devices: ["the cut on the release", "the hold before the laugh", "the sound-synced cut", "the one-reaction rule"]
refusals: ["dead air inside a gag", "coverage that flattens timing", "reaction coverage of every face", "a whip transition where the grammar forbids it"]
blind_spots: ["sincerity", "long dramatic takes", "grief tempo", "arthouse stillness"]
best_for: ["comedy runs", "ensemble comedy", "montage energy", "youth sequences", "the comedy set-piece at mass posture"]
posture_range: [0, 10]
